services:
  web:
    build: .
    ports:
      - "8080:80"

  # Vite dev server reachable from a phone on the LAN: docker compose --profile dev up dev
  dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npx vite --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
